<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" 
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en" lang="en">
<!-- Deklarasi XHTML, dengan dasar aturannya adalah HTML yang mengikuti aturan XML -->
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>My Page</title>
</head>
<!-- Bagian kepala halaman. Informasi dapat dilihat pada jendela halaman website, dimana 
    judul halaman akan ditampilkan -->
<body style="background-color: rgb(250, 215, 215); 
text-align: center;">
<!-- style yang diatur pada body adalah warna latar belakang dan posisi teks -->
    <h1 style="font-family:Verdana, Geneva, Tahoma, sans-serif;
    color: rgb(188, 24, 24);
    border: 2px solid rgb(222, 135, 135);
    background-color: rgb(255, 240, 240);">HTML</h1>
<!-- style yang diatur pada h1 adalah jenis font, warna teks, border, dan warna background -->
    <h4 style="font-family: Georgia, 'Times New Roman', Times, serif;
    border: 1px solid rgba(233, 122, 122, 0.7);
    background-color: rgba(247, 140, 151, 0.2);
    color: rgb(196, 20, 61);">Pengertian</h4>
<!-- style yang diatur pada h4 adalah jenis font, border, warna background, dan warna teks -->
    <p style="background-color: rgb(245, 228, 220);
    border: 1px solid rgb(165, 42, 42);
    border-radius: 2px;
    box-shadow: 0 0 3px rgba(0, 0, 0, 0.2);
    color: rgb(128, 26, 0);">HTML atau <em>Hypertext Markup Language</em> adalah <strong>bahasa markup</strong> yang digunakan untuk membuat halaman web.</p>
<!-- style yang diatur pada p adalah warna kotak, border, kelengkungan sudut border, bayangan kotak, dan warna teks -->
</body>
<!-- Bagian tubuh halaman, dimana berisi informasi yang ditampilkan ke pengguna. Tag h1 adalah heading, tag h4 adalah sub heading, dan tag p digunakan untuk membuat paragraf -->
</html>
